<!DOCTYPE html>
<!-- Document register: paper and ink. Client-facing. src/shared/tokens.css -->
<html lang="en" data-register="document">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">ArcFX Pay — Stablecoin payments on Arc</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    /* Hide the browser's default number-input spinner arrows (looked unfinished) */
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type="number"] { -moz-appearance: textfield; appearance: textfield; }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      /* Client-facing: the DOCUMENT register — paper, ink, a text serif.
         An invoice is the most public thing ArcFX produces and it gets printed,
         so it reads as a document rather than as software output.
         Tokens: src/shared/tokens.css */
      --bg:     var(--fx-bg);
      --card:   var(--fx-surface);
      --raised: var(--fx-sunken);
      --border: var(--fx-line);
      --bmed:   var(--fx-line);
      --text:   var(--fx-ink);
      --muted:  var(--fx-muted);
      --subtle: var(--fx-muted);
      --blue:   var(--fx-accent);
      --bdim:   var(--fx-sunken);
      --teal:   var(--fx-ok);
      --tdim:   var(--fx-ok-bg);
      --orange: var(--fx-warn);
      --red:    var(--fx-bad);
      --r: var(--fx-r); --rsm: var(--fx-r-sm); --rlg: var(--fx-r-lg);
    }
    html { scroll-behavior: smooth; }
    body { font-family: var(--fx-body); background: var(--bg); color: var(--text); min-height: 100vh; }
    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* Nav */
    nav { height: 62px; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; background: rgba(6,8,16,.96); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
    .nav-logo { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 700; color: var(--text); }
    .nav-logo img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 1.5px solid var(--bmed); }
    .btn-ghost { background: transparent; border: 1px solid var(--bmed); color: var(--text); font-size: 13px; font-weight: 500; padding: 8px 16px; border-radius: var(--rsm); cursor: pointer; font-family: var(--fx-body); transition: border-color .15s, background .15s; }
    .btn-ghost:hover { border-color: var(--blue); background: var(--bdim); }
    .btn-ghost.connected { font-family: "JetBrains Mono", monospace; font-size: 12px; color: var(--muted); }

    /* Page */
    .page { max-width: 520px; margin: 0 auto; padding: 52px 24px 80px; }

    /* Shared card */
    .main-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--rlg); overflow: hidden; }
    .card-head { padding: 22px 24px 0; }
    .card-body { padding: 20px 24px 24px; }
    .card-sep { height: 1px; background: var(--border); margin: 0 0 20px; }

    .eyebrow { display: inline-flex; align-items: center; gap: 7px; background: var(--raised); border: 1px solid var(--bmed); color: var(--muted); font-size: 11.5px; font-weight: 500; padding: 4px 12px; border-radius: 100px; margin-bottom: 18px; }
    .eyebrow-dot { width: 6px; height: 6px; border-radius: 50%; }

    h1 { font-size: clamp(26px, 5vw, 38px); font-weight: 700; letter-spacing: -1px; line-height: 1.1; margin-bottom: 10px; }
    .gradient { color: var(--fx-muted); font-weight: 400; }
    .sub { font-size: 14.5px; color: var(--muted); line-height: 1.7; margin-bottom: 28px; }

    /* Form fields */
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .field label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    .field input, .field select, .field textarea {
      background: var(--raised); border: 1px solid var(--border); border-radius: var(--rsm);
      color: var(--text); font-size: 14px; font-family: var(--fx-body);
      padding: 11px 13px; outline: none; transition: border-color .15s; width: 100%;
      -webkit-appearance: none;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--blue); }
    .field input::placeholder, .field textarea::placeholder { color: var(--subtle); }
    .field select option { background: var(--fx-surface); color: var(--text); }
    .field textarea { resize: none; min-height: 72px; font-size: 13.5px; line-height: 1.6; }
    .mono-input { font-family: "JetBrains Mono", monospace !important; font-size: 12.5px !important; }
    .field-hint { font-size: 11px; color: var(--muted); }

    /* Amount row */
    .amount-row { display: flex; gap: 10px; }
    .amount-row .field:first-child { flex: 1; }
    .amount-row .field:last-child { width: 160px; flex-shrink: 0; }

    /* Token selector */
    .token-btns { display: flex; gap: 6px; }
    .token-btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 7px; background: var(--raised); border: 1px solid var(--border); border-radius: var(--rsm); padding: 10px; font-size: 13.5px; font-weight: 600; cursor: pointer; transition: all .15s; color: var(--muted); font-family: var(--fx-body); }
    .token-btn:hover { border-color: var(--bmed); color: var(--text); }
    .token-btn.active { background: var(--bdim); border-color: rgba(61,126,255,.4); color: var(--blue); }
    .token-logo { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
    .usdc { background: #2775ca; color: #fff; }
    .eurc { background: #1a3ca8; color: #fff; }

    /* Buttons */
    .btn-primary { display: block; width: 100%; background: var(--fx-accent); color: var(--fx-on-accent); border: none; border-radius: var(--r); padding: 14px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: var(--fx-body); transition: opacity .15s; }
    .btn-primary:hover { opacity: .88; }
    .btn-primary:disabled { opacity: .4; cursor: not-allowed; }

    .btn-outline { display: block; width: 100%; background: transparent; border: 1px solid var(--bmed); color: var(--text); border-radius: var(--r); padding: 13px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: var(--fx-body); transition: all .15s; }
    .btn-outline:hover { border-color: var(--blue); background: var(--bdim); }

    /* Generated link box */
    .link-box { background: var(--raised); border: 1px solid var(--bmed); border-radius: var(--rsm); padding: 14px; margin-bottom: 14px; }
    .link-label { font-size: 10.5px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; }
    .link-url { font-family: "JetBrains Mono", monospace; font-size: 11.5px; color: var(--blue); word-break: break-all; line-height: 1.7; margin-bottom: 12px; }
    .copy-btn { display: flex; align-items: center; justify-content: center; gap: 7px; width: 100%; background: var(--bdim); border: 1px solid rgba(61,126,255,.3); color: var(--blue); border-radius: var(--rsm); padding: 9px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: var(--fx-body); transition: all .15s; }
    .copy-btn:hover { background: rgba(61,126,255,.18); }
    .copy-btn.copied { background: var(--tdim); border-color: rgba(0,212,170,.3); color: var(--teal); }

    /* QR code */
    .qr-wrap { display: flex; justify-content: center; margin: 14px 0; }
    #qr-canvas { background: #fff; padding: 12px; border-radius: var(--rsm); }

    /* Status */
    .status { border-radius: var(--rsm); padding: 12px 14px; font-size: 13px; line-height: 1.6; margin-top: 12px; }
    .status.info    { background: var(--bdim); border: 1px solid rgba(61,126,255,.25); color: var(--fx-accent); }
    .status.success { background: var(--tdim); border: 1px solid rgba(0,212,170,.25); color: var(--teal); }
    .status.error   { background: rgba(255,77,106,.07); border: 1px solid rgba(255,77,106,.25); color: var(--red); }
    .status-title   { font-weight: 700; margin-bottom: 5px; }

    /* Payment mode */
    .pay-avatar { width: 64px; height: 64px; border-radius: 50%; background: var(--raised); border: 2px solid var(--bmed); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-family: "JetBrains Mono", monospace; font-size: 16px; color: var(--muted); }
    .pay-to { text-align: center; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    .pay-address { text-align: center; font-family: "JetBrains Mono", monospace; font-size: 14px; color: var(--text); font-weight: 500; margin-bottom: 24px; }

    .pay-amount-display { text-align: center; margin-bottom: 20px; }
    .pay-amount-val { font-family: "JetBrains Mono", monospace; font-size: 52px; font-weight: 500; color: var(--text); letter-spacing: -2px; line-height: 1; margin-bottom: 6px; }
    .pay-amount-token { display: inline-flex; align-items: center; gap: 7px; background: var(--raised); border: 1px solid var(--bmed); border-radius: 100px; padding: 5px 14px; font-size: 14px; font-weight: 600; color: var(--text); }

    .pay-note { background: var(--raised); border: 1px solid var(--border); border-radius: var(--rsm); padding: 12px 14px; margin-bottom: 20px; font-size: 13.5px; color: var(--muted); line-height: 1.6; }
    .pay-note strong { color: var(--text); display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }

    .pay-any-amount { margin-bottom: 14px; }

    /* Success card */
    .success-card { background: var(--tdim); border: 1px solid rgba(0,212,170,.2); border-radius: var(--rlg); padding: 32px 24px; text-align: center; }
    .success-icon  { font-size: 44px; margin-bottom: 14px; }
    .success-title { font-size: 22px; font-weight: 700; color: var(--teal); margin-bottom: 8px; }
    .success-sub   { font-size: 13.5px; color: var(--muted); margin-bottom: 20px; line-height: 1.6; }
    .explorer-btn  { display: inline-block; color: var(--blue); font-size: 13px; font-family: "JetBrains Mono", monospace; border: 1px solid rgba(61,126,255,.25); border-radius: var(--rsm); padding: 7px 16px; transition: background .15s; }
    .explorer-btn:hover { background: var(--bdim); text-decoration: none; }

    /* Widget footer */
    .widget-footer { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
    .widget-footer a { color: var(--muted); }
    .widget-footer a:hover { color: var(--blue); text-decoration: none; }

    .hidden { display: none !important; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  </style>
</head>
<body>
  <!-- Header mount points — populated by /src/shared/header.ts -->
  <div id="arcfx-stats-bar"></div>
  <div id="arcfx-nav"></div>

  <!-- Shared header module — single source of truth across all pages.
       Edit /src/shared/header.ts to change the nav/stats-bar everywhere. -->
  <script type="module">
    import { arcfxMountHeader } from '/src/shared/header.ts';
    arcfxMountHeader({
      pageKey: 'pay',
      activeLink: 'tools',
      activeTool: 'pay'
    });
  </script>

  <div class="page" id="page-root"></div>

<script type="module">
import { BrowserProvider, Contract, parseUnits, formatUnits, isAddress, id as ethersId } from "https://esm.sh/ethers@6";
import { arcfxWallet } from "/src/shared/wallet.ts";

// ── Config ─────────────────────────────────────────────────────────────────
const TOKENS = {
  USDC: { address: "0x3600000000000000000000000000000000000000", decimals: 6 },
  EURC: { address: "0x89B50855Aa3bE2F677cD6303Cec089B5F319D72a", decimals: 6 },
};

const ARC_TESTNET = {
  chainId: "0x4CEF52",
  chainName: "Arc Network Testnet",
  nativeCurrency: { name: "USDC", symbol: "USDC", decimals: 18 },
  rpcUrls: ["https://rpc.testnet.arc.network"],
  blockExplorerUrls: ["https://testnet.arcscan.app"],
};

const ERC20_ABI = [
  "function balanceOf(address) view returns (uint256)",
  "function allowance(address,address) view returns (uint256)",
  "function approve(address spender, uint256 amount) returns (bool)",
  "function transfer(address to, uint256 amount) returns (bool)",
];

// ArcFXPayments contract — Arc Testnet
const PAYMENTS_ADDRESS = "0xc37D88f17573f13F7A27D33a502f5f1fB7D545D3";
const PAYMENTS_ABI = [
  "function pay(address token, address recipient, uint256 gross, bytes32 paymentId) external",
  "function quoteFee(uint256 gross) external pure returns (uint256 fee, uint256 net)",
  "function FEE_BPS() view returns (uint256)",
];

// ── State ──────────────────────────────────────────────────────────────────
let provider = null, signer = null, userAddress = null;
let selectedToken = "USDC";
let isPaying = false;

// ── URL params ─────────────────────────────────────────────────────────────
const params   = new URLSearchParams(window.location.search);
const toAddr   = params.get("to")     || "";
const fixedAmt = params.get("amount") || "";
const tokenPrm = (params.get("token") || "USDC").toUpperCase();
const note     = params.get("note")   || "";
// FX quote carried over from the invoice, so the payer sees the rate the
// invoice was quoted at. Indicative only — settlement is still in `token`.
const fxRate   = parseFloat(params.get("fxRate") || "");
const fxToken  = (params.get("fxToken") || "").toUpperCase();
const fxAt     = params.get("fxAt") || "";
const refParam = params.get("ref")    || "";

// Escape any user-supplied string before it goes into innerHTML.
// `note` comes straight from the URL and is attacker-controllable, so it must
// never be rendered as raw HTML (reflected-XSS guard).
function escapeHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}
// Display helper: thousands separators for amounts shown to the user (NOT for
// parseUnits inputs, which must stay raw). R1.
function fmtAmt(n, dp) {
  const num = typeof n === "number" ? n : parseFloat(n);
  if (!isFinite(num)) return String(n);
  return num.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: dp == null ? 4 : dp });
}
const isPayMode = isAddress(toAddr);

if (isPayMode) {
  document.getElementById("page-title").textContent = `Pay ${toAddr.slice(0,6)}… on ArcFX`;
  selectedToken = TOKENS[tokenPrm] ? tokenPrm : "USDC";
  renderPayMode();
  loadPayFeeBps();  // populate the live fee breakdown (recipient gets / fee / you pay)
} else {
  renderGenMode();
}

// ═══════════════════════════════════════════════════════
//  GENERATOR MODE
// ═══════════════════════════════════════════════════════
function renderGenMode() {
  document.getElementById("page-root").innerHTML = `
    <div class="eyebrow" style="margin-bottom:18px;">
      <div class="eyebrow-dot" style="background:var(--blue)"></div>
      Create a payment link
    </div>
    <h1>Get paid in<br><span class="gradient">stablecoins.</span></h1>
    <p class="sub">Generate a shareable link — anyone can pay you in USDC or EURC on Arc in one click.</p>

    <div class="main-card">
      <div class="card-body">

        <div class="field">
          <label for="gen-address">Your wallet address</label>
          <input id="gen-address" class="mono-input" type="text" placeholder="0x... (connect wallet or paste manually)" autocomplete="off" />
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;">
            <span class="field-hint">The address that will receive the payment.</span>
            <button type="button" id="contacts-toggle" onclick="toggleContactsPicker()"
                    style="background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:5px 11px;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap;transition:border-color .15s,color .15s;"
                    onmouseover="this.style.borderColor='var(--blue)';this.style.color='var(--text)'"
                    onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--muted)'">
              📇 From contacts
            </button>
          </div>
          <div id="contacts-picker" class="hidden" style="margin-top:8px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px;max-height:200px;overflow-y:auto;"></div>
        </div>

        <div class="amount-row">
          <div class="field">
            <label for="gen-amount">Amount <span style="color:var(--subtle)">(optional)</span></label>
            <input id="gen-amount" type="number" min="0" step="any" placeholder="Leave blank for any amount" autocomplete="off" />
          </div>
          <div class="field">
            <label>Token</label>
            <div class="token-btns">
              <button class="token-btn active" id="gen-usdc" onclick="genSelectToken('USDC')">
                <div class="token-logo usdc">$</div> USDC
              </button>
              <button class="token-btn" id="gen-eurc" onclick="genSelectToken('EURC')">
                <div class="token-logo eurc">€</div> EURC
              </button>
            </div>
          </div>
        </div>

        <div class="field">
          <label for="gen-note">Note <span style="color:var(--subtle)">(optional)</span></label>
          <textarea id="gen-note" placeholder="Invoice #1, freelance payment, etc."></textarea>
        </div>

        <button class="btn-primary" onclick="generateLink()">Generate payment link →</button>

        <div id="gen-result" class="hidden" style="margin-top:20px;">
          <div class="card-sep"></div>
          <div class="link-box">
            <div class="link-label">Your payment link</div>
            <div class="link-url" id="gen-url"></div>
            <button class="copy-btn" id="copy-btn" onclick="copyLink()">
              📋 Copy link
            </button>
          </div>
          <div class="qr-wrap"><div id="qr-canvas"></div></div>
          <div style="font-size:11.5px;color:var(--muted);text-align:center;margin-top:6px;">
            Share this link — anyone can pay you on Arc
          </div>
        </div>

        <div class="widget-footer" style="margin-top:20px;">
          <a href="/multisend">Multisend →</a>
          <a href="https://testnet.arcscan.app" target="_blank" rel="noopener">ArcScan ↗</a>
        </div>
      </div>
    </div>
  `;

  // Auto-fill address if wallet connected
  if (userAddress) {
    const inp = document.getElementById("gen-address");
    if (inp) inp.value = userAddress;
  }
}

window.genSelectToken = function(sym) {
  selectedToken = sym;
  document.getElementById("gen-usdc")?.classList.toggle("active", sym==="USDC");
  document.getElementById("gen-eurc")?.classList.toggle("active", sym==="EURC");
};

window.generateLink = function() {
  const addr   = document.getElementById("gen-address")?.value.trim() || "";
  const amount = document.getElementById("gen-amount")?.value.trim()  || "";
  const note   = document.getElementById("gen-note")?.value.trim()    || "";

  if (!isAddress(addr)) {
    alert("Enter a valid wallet address first.");
    return;
  }

  const base = window.location.origin + "/pay";
  const p    = new URLSearchParams();
  p.set("to", addr);
  if (amount) p.set("amount", amount);
  p.set("token", selectedToken);
  if (note) p.set("note", note);
  // Unique reference so each generated link has its own on-chain paymentId
  // (without this, every no-note payment collides on the same id). Invoice
  // links are generated elsewhere and intentionally omit `ref`. (M21)
  p.set("ref", `arcfx-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`);

  const url = `${base}?${p.toString()}`;

  const urlEl   = document.getElementById("gen-url");
  const result  = document.getElementById("gen-result");
  const qrEl    = document.getElementById("qr-canvas");

  if (urlEl)  urlEl.textContent = url;
  if (result) result.classList.remove("hidden");

  // Generate QR code
  if (qrEl) {
    qrEl.innerHTML = "";
    new QRCode(qrEl, { text: url, width: 180, height: 180, colorDark:"#060810", colorLight:"#ffffff" });
  }
};

window.copyLink = function() {
  const url = document.getElementById("gen-url")?.textContent || "";
  navigator.clipboard.writeText(url).then(() => {
    const btn = document.getElementById("copy-btn");
    if (!btn) return;
    btn.textContent = "✓ Copied!";
    btn.classList.add("copied");
    setTimeout(() => { btn.innerHTML = "📋 Copy link"; btn.classList.remove("copied"); }, 2000);
  });
};

// ═══════════════════════════════════════════════════════
//  PAYMENT MODE
// ═══════════════════════════════════════════════════════
function renderPayMode() {
  const shortTo  = `${toAddr.slice(0,8)}…${toAddr.slice(-6)}`;
  const hasFixed = fixedAmt && parseFloat(fixedAmt) > 0;
  const sym      = selectedToken;

  document.getElementById("page-root").innerHTML = `
    <div id="pay-success" class="hidden">
      <div class="success-card">
        <div class="success-icon">✅</div>
        <div class="success-title">Payment sent!</div>
        <div class="success-sub" id="success-sub">—</div>
        <a id="success-link" href="#" target="_blank" rel="noopener" class="explorer-btn">View on ArcScan ↗</a>
        <br><br>
        <button onclick="payAgain()" style="background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:var(--rsm);padding:9px 20px;font-size:13px;cursor:pointer;font-family:inherit;transition:border-color .15s,color .15s;"
                onmouseover="this.style.borderColor='var(--blue)';this.style.color='var(--text)'"
                onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--muted)'">
          Make another payment →
        </button>
      </div>
    </div>

    <div id="pay-card" class="main-card">
      <div class="card-body" style="padding-top:28px;">

        <!-- Recipient -->
        <div class="pay-avatar">${toAddr.slice(2,6)}</div>
        <div class="pay-to">Sending to</div>
        <div class="pay-address">${shortTo}</div>

        <!-- Amount display -->
        <div class="pay-amount-display">
          <div class="pay-amount-val" id="pay-amount-display">${hasFixed ? fmtAmt(parseFloat(fixedAmt), 2) : "—"}</div>
          <br>
          <div class="pay-amount-token">
            <div class="token-logo ${sym.toLowerCase()}">${sym==="USDC"?"$":"€"}</div>
            ${sym}
          </div>
          ${hasFixed && isFinite(fxRate) && fxRate > 0 && (fxToken === "USDC" || fxToken === "EURC") ? `
          <div style="margin-top:10px;font-size:12px;color:var(--fx-muted);line-height:1.6;">
            ≈ ${fmtAmt(parseFloat(fixedAmt) / fxRate, 2)} ${fxToken}
            &nbsp;·&nbsp; 1 ${fxToken} = ${fxRate.toFixed(4)} ${sym}
            <br><span style="font-size:11px;color:var(--fx-muted);">Indicative FX quote${fxAt ? " from " + new Date(fxAt).toLocaleDateString() : ""} — settles in ${sym}</span>
          </div>` : ""}
        </div>

        ${!hasFixed ? `
        <div class="pay-any-amount">
          <div class="field">
            <label for="pay-custom-amount">Amount</label>
            <input id="pay-custom-amount" type="number" min="0" step="any" placeholder="0.00" autocomplete="off"
              oninput="document.getElementById('pay-amount-display').textContent = this.value || '—'; updateFeeBreakdown();" />
          </div>
        </div>` : ""}

        <div id="fee-breakdown" style="display:none;background:var(--raised);border:1px solid var(--bmed);border-radius:var(--rsm);padding:12px 14px;margin-bottom:14px;font-size:13px;">
          <div style="display:flex;justify-content:space-between;margin-bottom:5px;"><span style="color:var(--muted);">Recipient receives</span><span id="fb-net" style="font-family:'JetBrains Mono',monospace;color:var(--text);">—</span></div>
          <div style="display:flex;justify-content:space-between;margin-bottom:5px;"><span style="color:var(--muted);">ArcFX fee <span id="fb-pct" style="color:var(--subtle);"></span></span><span id="fb-fee" style="font-family:'JetBrains Mono',monospace;color:var(--subtle);">—</span></div>
          <div style="display:flex;justify-content:space-between;padding-top:7px;border-top:1px solid var(--bmed);font-weight:600;"><span style="color:var(--text);">You pay</span><span id="fb-gross" style="font-family:'JetBrains Mono',monospace;color:var(--text);">—</span></div>
        </div>

        ${note ? `
        <div class="pay-note">
          <strong>Note</strong>
          ${escapeHtml(note)}
        </div>` : ""}

        <div id="pay-status"></div>

        <!-- Connect state -->
        <div id="pay-connect">
          <button class="btn-primary" onclick="connectAndPay()">Connect wallet to pay</button>
          <div style="text-align:center;margin-top:10px;font-size:12px;color:var(--muted);">
            Arc Testnet · ${sym} · Non-custodial
          </div>
        </div>

        <!-- Pay state (shown after connect) -->
        <div id="pay-action" class="hidden">
          <div style="background:var(--raised);border:1px solid var(--border);border-radius:var(--rsm);padding:11px 14px;margin-bottom:14px;font-size:12px;color:var(--muted);font-family:'JetBrains Mono',monospace;">
            Balance: <strong id="pay-balance" style="color:var(--text);">—</strong> ${sym}
          </div>
          <button class="btn-primary" id="pay-btn" onclick="sendPayment()">
            Send ${hasFixed ? fmtAmt(parseFloat(fixedAmt), 2)+" " : ""}${sym} →
          </button>
        </div>

        <div class="widget-footer" style="margin-top:16px;">
          <a href="/">ArcFX</a>
          <a href="https://testnet.arcscan.app/address/${toAddr}" target="_blank" rel="noopener">View recipient ↗</a>
        </div>
      </div>
    </div>
  `;
}

// Build this page's own provider/signer from the shared session. The session
// module deliberately holds no ethers objects, so each page constructs them
// with the ethers build it already imports.
async function adoptSession(state) {
  if (!state.connected || !window.ethereum) {
    provider = signer = userAddress = null;
    document.getElementById("pay-action")?.classList.add("hidden");
    document.getElementById("pay-connect")?.classList.remove("hidden");
    return;
  }
  if (!state.onArc) {
    // Connected, but pointed at another network — never let a payment proceed.
    showPayStatus("Switch to Arc Testnet to continue — the payment can't proceed on another network.", "error");
    document.getElementById("pay-action")?.classList.add("hidden");
    document.getElementById("pay-connect")?.classList.remove("hidden");
    return;
  }

  provider    = new BrowserProvider(window.ethereum);
  signer      = await provider.getSigner();
  userAddress = state.address;

  try {
    const tok = TOKENS[selectedToken];
    const tc  = new Contract(tok.address, ERC20_ABI, provider);
    const bal = await tc.balanceOf(userAddress);
    const balEl = document.getElementById("pay-balance");
    if (balEl) balEl.textContent = fmtAmt(parseFloat(formatUnits(bal, tok.decimals)));
  } catch { /* balance is a nicety; never block paying on it */ }

  document.getElementById("pay-connect")?.classList.add("hidden");
  document.getElementById("pay-action")?.classList.remove("hidden");
}

// Restores silently on load, and re-fires when the user switches account or
// network in their wallet — so this page never asks twice for a session the
// browser already granted.
arcfxWallet.onChange(state => {
  adoptSession(state).catch(err => {
    // Never swallow this silently: if adopting the session fails the page looks
    // connected in the nav but cannot pay, which is the exact confusion this
    // module exists to remove.
    console.error("[pay] could not adopt wallet session:", err);
    showPayStatus("Wallet session could not be restored. Click connect to retry.", "error");
  });
});

async function connectAndPay() {
  const btn = document.getElementById("pay-connect")?.querySelector("button");
  try {
    if (btn) btn.textContent = "Connecting…";
    const state = await arcfxWallet.connect();
    if (!state.onArc) {
      showPayStatus("Please switch to Arc Testnet to continue — the payment can't proceed on another network.", "error");
      if (btn) btn.textContent = "Connect wallet to pay";
      return;
    }
    await adoptSession(state);
  } catch (err) {
    showPayStatus("Connection failed: " + (err?.message || err), "error");
    if (btn) btn.textContent = "Connect wallet to pay";
  }
}

async function sendPayment() {
  if (isPaying || !signer) return;

  // Determine amount
  let amount = fixedAmt;
  if (!amount || parseFloat(amount) <= 0) {
    const custom = document.getElementById("pay-custom-amount")?.value.trim();
    amount = custom || "";
  }
  if (!amount || parseFloat(amount) <= 0) {
    showPayStatus("Enter an amount.", "error"); return;
  }

  isPaying = true;
  const btn = document.getElementById("pay-btn");
  if (btn) { btn.disabled = true; btn.textContent = "Approving…"; }

  try {
    const tok      = TOKENS[selectedToken];
    const erc20    = new Contract(tok.address, ERC20_ABI, signer);
    const payments = new Contract(PAYMENTS_ADDRESS, PAYMENTS_ABI, signer);

    // The entered amount is what the RECIPIENT should receive (net). The contract
    // deducts FEE_BPS from whatever it's sent, so we gross it up: the payer sends
    // `gross`, the contract takes the fee, and the recipient nets >= the entered
    // amount. Integer (BigInt) math with ceiling — never float — so the recipient
    // is never short by dust.
    const wantNet = parseUnits(parseFloat(amount).toFixed(tok.decimals), tok.decimals);

    // feeBps read live from the contract (anti-drift); falls back to 15 (0.15%),
    // which is what ArcFXPayments actually has deployed. The Multisender is 10.
    let bps = 15n;
    try { bps = BigInt(await payments.FEE_BPS()); } catch { bps = 15n; }
    const DENOM = 10000n;
    // gross = ceil(wantNet * DENOM / (DENOM - bps))
    const denomNet = DENOM - bps;
    let gross = (wantNet * DENOM + (denomNet - 1n)) / denomNet;

    // Belt-and-suspenders: confirm the contract's own math nets >= wantNet,
    // and nudge up by the smallest unit if a rounding edge ever leaves it short.
    try {
      const q = await payments.quoteFee(gross);
      if (q.net < wantNet) gross = gross + 1n;
    } catch { /* quoteFee best-effort; the ceiling above already covers it */ }

    // Build paymentId. Prefer an explicit unique `ref` (generic links add one,
    // so no-note payments don't all collide on keccak("arcfx-payment")). Invoice
    // links carry no `ref` and keep keccak(note=invoiceNumber) so the invoice
    // paid-check (which matches on the invoice number) still reconciles (M21).
    const idSource  = refParam || note || "arcfx-payment";
    const paymentId = ethersId(idSource); // keccak256 of the reference string

    // Step 1 — Approve ArcFXPayments to spend the grossed-up amount
    showPayStatus("Step 1/2 — Approve token spending in MetaMask…", "info");
    const approveTx = await erc20.approve(PAYMENTS_ADDRESS, gross);
    await approveTx.wait();

    // Step 2 — Call pay() on ArcFXPayments contract
    if (btn) btn.textContent = "Paying…";
    showPayStatus("Step 2/2 — Confirm payment in MetaMask…", "info");
    const payTx   = await payments.pay(tok.address, toAddr, gross, paymentId);
    const receipt = await payTx.wait();

    // Success
    document.getElementById("pay-card")?.classList.add("hidden");
    const sc = document.getElementById("pay-success");
    if (sc) sc.classList.remove("hidden");

    const sub  = document.getElementById("success-sub");
    const link = document.getElementById("success-link");

    // Display: recipient received the full entered amount; show what payer paid.
    const grossF = parseFloat(formatUnits(gross, tok.decimals));
    const netF   = parseFloat(amount);
    const feeF   = grossF - netF;
    if (sub)  sub.textContent = `${fmtAmt(netF)} ${selectedToken} delivered to recipient · you paid ${fmtAmt(grossF)} (incl. ${fmtAmt(feeF)} fee)`;
    if (link) link.href = `https://testnet.arcscan.app/tx/${receipt.hash}`;

  } catch(err) {
    isPaying = false;
    if (btn) { btn.disabled = false; btn.textContent = `Send ${selectedToken} →`; }
    const rejected   = err.code===4001 || err.message?.includes("rejected") || err.message?.includes("denied");
    const selfPay    = err.message?.includes("Cannot pay yourself");
    const noAllowance = err.message?.includes("allowance") || err.message?.includes("Insufficient allowance");
    const msg = rejected    ? "Transaction rejected in MetaMask."
              : selfPay     ? "Cannot pay yourself. Generate the link with a different recipient address."
              : noAllowance ? "Approval failed. Please try again."
              : `Failed: ${err.reason || err.message}`;
    showPayStatus(msg, "error");
  }
}

function showPayStatus(msg, type) {
  const el = document.getElementById("pay-status");
  if (el) el.innerHTML = msg ? `<div class="status ${type}">${msg}</div>` : "";
}

// ── Wallet connect (nav button) ────────────────────────────────────────────
// The shared session handles prompting, the chain switch and painting the nav
// button; this only has to do the bit that is specific to this page.
document.getElementById("connect-btn")?.addEventListener("click", async () => {
  if (isPayMode) { connectAndPay(); return; }
  try {
    const state = await arcfxWallet.connect();
    if (!state.onArc) return; // don't present a connected state on the wrong network
    await adoptSession(state);
    const inp = document.getElementById("gen-address");
    if (inp && state.address) inp.value = state.address; // pre-fill the link generator
  } catch { /* user dismissed the wallet dialog */ }
});

// Keep the link generator's address in step with the wallet, including when the
// session is restored on load rather than clicked.
arcfxWallet.onChange(state => {
  const inp = document.getElementById("gen-address");
  if (inp && !inp.value && state.connected && state.address) inp.value = state.address;
});

window.ethereum?.on("chainChanged", () => window.location.reload());
window.ethereum?.on("accountsChanged", (a) => { if (!a.length) window.location.reload(); });

// expose for pay mode
window.connectAndPay = connectAndPay;
window.sendPayment   = sendPayment;

// Fee breakdown (live): shows "recipient receives / fee / you pay" so the
// payer sees the gross-up upfront. Fee rate read from the contract once.
let payFeeBps = 15n;
async function loadPayFeeBps() {
  try {
    const p = new Contract(PAYMENTS_ADDRESS, PAYMENTS_ABI, provider || new BrowserProvider(window.ethereum));
    payFeeBps = BigInt(await p.FEE_BPS());
  } catch { payFeeBps = 15n; }
  updateFeeBreakdown();
}
window.updateFeeBreakdown = function() {
  const box = document.getElementById("fee-breakdown");
  if (!box) return;
  const raw = (fixedAmt && parseFloat(fixedAmt) > 0)
    ? fixedAmt
    : (document.getElementById("pay-custom-amount")?.value || "");
  const net = parseFloat(raw);
  if (!net || net <= 0) { box.style.display = "none"; return; }

  const bps = Number(payFeeBps);
  const gross = net * 10000 / (10000 - bps);
  const fee   = gross - net;
  const sym   = selectedToken;
  const set = (id, v) => { const n = document.getElementById(id); if (n) n.textContent = v; };
  set("fb-net",  `${fmtAmt(net, 2)} ${sym}`);
  set("fb-fee",  `${fmtAmt(fee, 2)} ${sym}`);
  set("fb-gross",`${fmtAmt(gross, 2)} ${sym}`);
  set("fb-pct",  `(${(bps/100).toFixed(2)}%)`);
  box.style.display = "block";

  // Reflect the typed amount on the Send button (L15) — only meaningful for
  // custom-amount links (fixed-amount links already show it).
  const payBtn = document.getElementById("pay-btn");
  if (payBtn && !(fixedAmt && parseFloat(fixedAmt) > 0)) {
    payBtn.textContent = `Send ${fmtAmt(net, 2)} ${sym} →`;
  }
};
// "Make another payment" — reload the same URL so the recipient/amount context
// is preserved and the form resets cleanly (no stale success state).
window.payAgain = function() { window.location.reload(); };

// ── Contacts picker (generator: fill "Your wallet address" from saved contacts) ──
// Reads the same localStorage address book used by the multisend page.
window.toggleContactsPicker = function() {
  const picker = document.getElementById("contacts-picker");
  if (!picker) return;
  const isHidden = picker.classList.contains("hidden");
  if (!isHidden) { picker.classList.add("hidden"); return; }

  let entries = [];
  try { entries = JSON.parse(localStorage.getItem("arcfx_address_book") || "[]"); } catch { entries = []; }

  if (!entries.length) {
    picker.innerHTML = `<div style="text-align:center;padding:16px;color:var(--subtle);font-size:12.5px;">
      No saved contacts yet. Add them on the <a href="/multisend" style="color:var(--blue);">Multisend</a> page.
    </div>`;
  } else {
    picker.innerHTML = entries.map(c => {
      const name = escapeHtml(c.name || "Unnamed");
      const addr = escapeHtml(c.address || "");
      const shortA = addr ? `${addr.slice(0,8)}…${addr.slice(-6)}` : "";
      return `<div onclick="pickContact('${addr}')"
        style="display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;cursor:pointer;transition:background .12s;"
        onmouseover="this.style.background='var(--raised)'" onmouseout="this.style.background='transparent'">
        <div style="width:26px;height:26px;border-radius:50%;background:var(--blue-dim);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;">${name.slice(0,1).toUpperCase()}</div>
        <div style="min-width:0;">
          <div style="font-size:13px;color:var(--text);font-weight:500;">${name}</div>
          <div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--subtle);">${shortA}</div>
        </div>
      </div>`;
    }).join("");
  }
  picker.classList.remove("hidden");
};

window.pickContact = function(addr) {
  const input = document.getElementById("gen-address");
  if (input) input.value = addr;
  const picker = document.getElementById("contacts-picker");
  if (picker) picker.classList.add("hidden");
};
</script>
